<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>阿爸套房平面標註</title><style>
:root{--bg:#f4f1ec;--fg:#333;--line:#cfc6ba;--card:#fff}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;display:flex;flex-direction:column;height:100vh}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);align-items:center}
#bar button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer}
#bar button.on{background:#333;color:#fff;border-color:#333}
#bar .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
#main{flex:1;display:flex;min-height:0}
#wrap{flex:1;overflow:auto;background:#ddd}
canvas{display:block;touch-action:none}
#side{width:300px;background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:12px;font-size:14px}
#side h3{margin:0 0 8px;font-size:15px}
#side ol{padding-left:22px;margin:0}#side li{margin:0 0 8px;line-height:1.5}
#side li span{cursor:pointer}#side li button{border:0;background:none;color:#999;cursor:pointer}
#side textarea{width:100%;box-sizing:border-box;height:120px;margin-top:10px;font:inherit}
.hint{color:#888;font-size:12px;line-height:1.6;margin-top:10px}
@media(max-width:760px){#main{flex-direction:column}#side{width:auto;max-height:35vh;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="bar">
<button data-t="num" class="on">① 編號標記</button><button data-t="pen">✏️ 畫筆</button><button data-t="arrow">➜ 箭頭</button><button data-t="rect">▭ 方框</button><button data-t="text">T 文字</button><button data-t="del">🧽 刪除</button>
<span class="sep"></span>顏色<input type="color" id="col" value="#dd2222">
<span class="sep"></span><button id="undo">↶ 復原</button><button id="redo">↷ 重做</button><button id="clear">清空</button>
<span class="sep"></span><button id="zo">－</button><button id="fit">符合寬度</button><button id="zi">＋</button>
<span class="sep"></span><button id="save" style="background:#2a6;color:#fff;border-color:#2a6">💾 存成圖片</button>
</div>
<div id="main"><div id="wrap"><canvas id="c"></canvas></div>
<div id="side"><h3>修改清單</h3><ol id="list"></ol>
<textarea id="memo" placeholder="其他整體說明（也會印在圖片下方）"></textarea>
<div class="hint">用法：選「編號標記」點圖上位置，輸入要改的內容；點清單文字可修改。畫筆/箭頭/方框用拖曳畫；選「刪除」再點標註可移除。標註會自動暫存在這台電腦的瀏覽器。完成後按「存成圖片」，把下載的 PNG 告訴 Claude。</div></div></div>

const col=()=>document.getElementById('col').value,nums=()=>items.filter(i=>i.t==='num');
function arrow(a,b){const g=Math.atan2(b.y-a.y,b.x-a.x),h=26;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();

function drawItem(i){x.strokeStyle=x.fillStyle=i.c;x.lineWidth=5;x.lineCap=x.lineJoin='round';
 if(i.t==='pen'){x.beginPath();i.p.forEach((p,k)=>k?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke()}
 else if(i.t==='arrow')arrow(i.a,i.b);

 else if(i.t==='text'){x.font='bold 34px "Microsoft JhengHei",sans-serif';i.s.split('\n').forEach((l,k)=>{x.lineWidth=8;x.strokeStyle='#fff';x.strokeText(l,i.a.x,i.a.y+k*40);x.fillText(l,i.a.x,i.a.y+k*40)})}
 else if(i.t==='num'){const n=nums().indexOf(i)+1;x.beginPath();x.arc(i.a.x,i.a.y,24,0,7);x.fill();x.lineWidth=3;x.strokeStyle='#fff';x.stroke();
  x.fillStyle='#fff';x.font='bold 28px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(n,i.a.x,i.a.y+1);x.textAlign='left';x.textBaseline='alphabetic'}}

function list(){document.getElementById('list').innerHTML=nums().map((i,k)=>`<li><span data-k="${k}">${(i.s||'（未填）').replace(/</g,'&lt;')}</span> <button data-d="${k}" title="刪除">✕</button></li>`).join('')}
document.getElementById('list').onclick=e=>{const n=nums(),d=e.target.dataset;
 if(d.k){const i=n[+d.k],s=prompt('修改內容',i.s);if(s!=null){i.s=s;commit()}}
 if(d.d){items.splice(items.indexOf(n[+d.d]),1);commit()}};
function commit(){redo=[];persist();draw()}
function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function hit(p){const d=a=>Math.hypot(a.x-p.x,a.y-p.y),inb=(a,b)=>p.x>Math.min(a.x,b.x)-20&&p.x<Math.max(a.x,b.x)+20&&p.y>Math.min(a.y,b.y)-20&&p.y<Math.max(a.y,b.y)+20;
 for(let k=items.length-1;k>=0;k--){const i=items[k];
  if(i.t==='num'&&d(i.a)<30)return k;
  if(i.t==='text'&&p.x>i.a.x-10&&p.x<i.a.x+34*Math.max(...i.s.split('\n').map(l=>l.length))&&p.y>i.a.y-40&&p.y<i.a.y+40*i.s.split('\n').length-20)return k;
  if((i.t==='arrow'||i.t==='rect')&&inb(i.a,i.b))return k;
  if(i.t==='pen'&&i.p.some(q=>d(q)<20))return k}return -1}
c.onpointerdown=e=>{const p=pt(e);
 if(tool==='num'){const s=prompt('第 '+(nums().length+1)+' 點：要改什麼？');if(s!=null){items.push({t:'num',a:p,s,c:col()});commit()}return}
 if(tool==='text'){const s=prompt('輸入文字（換行請打 / ）');if(s){items.push({t:'text',a:p,s:s.split('/').join('\n'),c:col()});commit()}return}
 if(tool==='del'){const k=hit(p);if(k>=0){items.splice(k,1);commit()}return}

c.onpointerup=()=>{if(!cur)return;if(cur.t==='pen'?cur.p.length>1:Math.hypot(cur.b.x-cur.a.x,cur.b.y-cur.a.y)>8)items.push(cur);cur=null;commit()};
