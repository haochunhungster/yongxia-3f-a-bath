<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>浴區版本總覽</title><style>
:root{--bg:#f3f1ee;--fg:#2f2c29;--mut:#857d74;--card:#fff;--line:#d8cfc3;--acc:#2f2c29}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b19;--fg:#ece7e1;--mut:#a39a90;--card:#2a2724;--line:#45403a;--acc:#ece7e1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1b19;--fg:#ece7e1;--mut:#a39a90;--card:#2a2724;--line:#45403a;--acc:#ece7e1;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
header,.schemes,.bar,main{max-width:1500px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
h1{font-weight:500;margin:0;padding-top:24px}header p{color:var(--mut);margin:6px 0 14px}
.schemes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.scheme{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 4px #0001}.scheme h3{margin:0 0 4px;font-weight:500;display:flex;gap:8px;align-items:center}
.scheme h3 span,figcaption b{font-size:12px;background:var(--acc);color:var(--bg);border-radius:99px;padding:1px 8px;font-weight:500}
.scheme p{color:var(--mut);font-size:13px;margin:0 0 8px;line-height:1.6}.plan{width:100%;border-radius:8px;display:block}
.wm{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}.wm img{width:100%;border-radius:6px;display:block}.cnt{margin:6px 0 0!important}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px}
.bar button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:4px 11px;cursor:pointer}
.bar button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}.bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding-bottom:40px}
figure{margin:0;background:var(--card);border-radius:10px;overflow:hidden}figure img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover}
figcaption{font-size:13px;padding:7px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}figcaption i{font-style:normal;color:var(--mut)}
.grp{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}.grp::-webkit-scrollbar{display:none}
.grp .lb{font-size:12px;color:var(--mut);white-space:nowrap}.bar button{white-space:nowrap;flex:none}
@media (max-width:600px){h1{font-size:20px;padding-top:16px}header p{font-size:13px;line-height:1.6}
.bar{flex-direction:column;align-items:stretch;gap:6px}.bar button{padding:6px 12px;font-size:14px}
main{grid-template-columns:1fr 1fr;gap:8px}figcaption{font-size:11px;padding:5px 7px}figcaption i{width:100%}
.schemes{grid-template-columns:1fr}}
@media (max-width:360px){main{grid-template-columns:1fr}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
</style></head><body>
<header><h1>3F_A 招牌套房｜浴區全部版本總覽</h1><p>三種淋浴配置（v6 西側洗い場／A 廁所南側／B 浴池東側）× 三視角 × 風格。浴池已預埋不動。AI 效果圖看質感，配置以平面圖與白模為準。</p></header>
<section class="schemes"><article class="scheme"><h3><span>v6</span>西側洗い場</h3><p>浴池西側日式洗い場 105×162，靠走道側清玻璃擋水；廁所 123×142。</p><a href="img/000.jpg" target="_blank"><img class="plan" loading="lazy" src="img/000.jpg" alt="平面"></a><div class="wm"><img loading="lazy" src="img/001.jpg" alt="俯視白模"><img loading="lazy" src="img/002.jpg" alt="由房間白模"><img loading="lazy" src="img/003.jpg" alt="由門口白模"></div><p class="cnt">效果圖 60 張</p></article><article class="scheme"><h3><span>v7A</span>A｜淋浴在廁所南側</h3><p>廁所南牆北移 35 cm（廁所 123×103），淋浴 123×97 貼廁所南牆，花灑裝實牆，西側清玻璃；東窗需霧面；置物檯縮短。</p><a href="img/004.jpg" target="_blank"><img class="plan" loading="lazy" src="img/004.jpg" alt="平面"></a><div class="wm"><img loading="lazy" src="img/005.jpg" alt="俯視白模"><img loading="lazy" src="img/006.jpg" alt="由房間白模"><img loading="lazy" src="img/007.jpg" alt="由門口白模"></div><p class="cnt">效果圖 30 張</p></article><article class="scheme"><h3><span>v7B</span>B｜淋浴在浴池東側</h3><p>廁所不動，淋浴 75×162 沿東牆，花灑裝東牆；寬度偏窄。</p><a href="img/004.jpg" target="_blank"><img class="plan" loading="lazy" src="img/004.jpg" alt="平面"></a><div class="wm"><img loading="lazy" src="img/008.jpg" alt="俯視白模"><img loading="lazy" src="img/009.jpg" alt="由房間白模"><img loading="lazy" src="img/010.jpg" alt="由門口白模"></div><p class="cnt">效果圖 30 張</p></article></section>
